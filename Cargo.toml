[package]
name = "carplayd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
env_logger = "0.11.10"
log = { version = "0.4.29", features = ["std"] }
nusb = { version = "0.2.3", features = ["tokio"] }
tokio = { version = "1.51.0", features = ["full"] }
libc = "0.2"
usb-gadget = { version = "1.1.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
thiserror = "2"
mdns-sd = { version = "0.21.0", features = ["async"] }
rtnetlink = "0.23.0"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
